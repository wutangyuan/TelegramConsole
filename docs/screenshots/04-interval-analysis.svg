  .metric { font: 700 26px 'Segoe UI', Arial; fill: #10243e; }
  .console { font: 600 18px Consolas, monospace; } .green { fill: #35d26b; } .white { fill: #f2f6fb; } .blue { fill: #39a4ff; }
  .line { stroke: #dce7f0; stroke-width: 1; }
</style>
